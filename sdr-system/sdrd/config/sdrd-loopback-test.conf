# Host-only protocol smoke-test configuration. Do not deploy this file.
mode=shadow
listen_address=127.0.0.1
listen_port=43110
client_timeout_ms=2000
iio_sysfs_root=/sys/bus/iio/devices
fpga_backend=disabled
fpga_device=/dev/mem
fpga_base=0x43c00000
fpga_span=0x10000
require_iomem_region=true
allow_devmem=false
