# P201 Pro SDR Linux control-plane shadow configuration.
# This file is intentionally non-mutating and matches the original BOOT.bin
# currently observed on the SDR on 2026-08-31.

mode=shadow
listen_address=192.168.1.10
listen_port=43110
client_timeout_ms=5000

iio_sysfs_root=/sys/bus/iio/devices

# The current original FPGA image does not expose the later 0x43c00000 page.
# Do not change this until BOOT identity and /proc/iomem or UIO are verified.
fpga_backend=disabled
fpga_device=/dev/mem
fpga_base=0x43c00000
fpga_span=0x10000
require_iomem_region=true
allow_devmem=false
