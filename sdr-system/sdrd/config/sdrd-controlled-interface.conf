# Controlled-mode development interface. Do not install it as a service yet.
# It binds to SDR loopback by default; a non-loopback listener needs a reviewed
# authentication and deployment design before production use.

mode=controlled
listen_address=127.0.0.1
listen_port=43110
client_timeout_ms=5000

iio_sysfs_root=/sys/bus/iio/devices
development_data_root=/tmp/sdr-agent-dev
iio_timeout_ms=2000
iio_buffer_samples=4096
retune_settle_ms=5

min_center_hz=70000000
max_center_hz=6000000000
min_sample_rate_hz=2083333
max_sample_rate_hz=30720000
min_rf_bandwidth_hz=200000
max_rf_bandwidth_hz=56000000
max_capture_bytes=67108864
