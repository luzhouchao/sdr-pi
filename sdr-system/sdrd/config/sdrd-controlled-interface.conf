# Controlled-mode interface example. Do not deploy or start this file yet.
# The production IIO Adapter is intentionally unavailable, so sdrd will report
# radio_control=false and reject execution with radio_backend_unavailable.

mode=controlled
listen_address=127.0.0.1
listen_port=43110
client_timeout_ms=5000

iio_sysfs_root=/sys/bus/iio/devices
development_data_root=/tmp/sdr-agent-dev

min_center_hz=70000000
max_center_hz=6000000000
min_sample_rate_hz=2083333
max_sample_rate_hz=30720000
min_rf_bandwidth_hz=200000
max_rf_bandwidth_hz=56000000
max_capture_bytes=67108864

# The current original BOOT.bin has no validated custom FPGA register page.
fpga_backend=disabled
fpga_device=/dev/mem
fpga_base=0x43c00000
fpga_span=0x10000
require_iomem_region=true
allow_devmem=false
