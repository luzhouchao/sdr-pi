[package]
name = "p201pro-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Minimal Rust/libiio probe and capture test for the PUZHI P201 Pro"
license = "MIT"

[dependencies]
industrial-io = "=0.6.1"
rustfft = "=6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "p201pro-fft-bench"
path = "src/bin/fft_bench.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
