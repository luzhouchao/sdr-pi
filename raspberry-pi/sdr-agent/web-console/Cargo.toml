[package]
name = "sdr-agent-web-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tailnet-only web console for the Raspberry Pi SDR agent"
license = "MIT"

[dependencies]
axum = "0.8"
futures-util = "0.3"
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdr-agent-controller = { path = "../controller" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
