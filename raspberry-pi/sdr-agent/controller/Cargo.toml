[package]
name = "sdr-agent-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic safety controller for the Raspberry Pi SDR agent"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
