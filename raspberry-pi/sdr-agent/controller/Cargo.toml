[package]
name = "sdr-agent-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Deterministic safety controller for the Raspberry Pi SDR agent"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
